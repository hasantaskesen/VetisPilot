<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VetisPilot Panel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-column app shell – sticky ink top bar, content column, quiet footer. Single light look on purpose (brand colors of the panel). */
:root{--ink:#0E0B2B;--accent:#5B3DF5;--mint:#34D399;--page:#F4F5F7;--line:#E5E7EB;--muted:#4B5563;
  --htgo:#1D4ED8;--htgo-dark:#0B2A6F;--htgo-light:#DBE6FF;--gk:#7C4A21;--gk-dark:#3E2410;--gk-light:#F3E6D3}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--page);color:#111827;display:flex;flex-direction:column;min-height:100%;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--ink)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;cursor:pointer}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--ink);color:#fff;padding-block:10px;min-height:60px}
.iconbtn{background:none;border:0;color:#fff;width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.iconbtn:hover{background:rgba(255,255,255,.1)} .iconbtn:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.branch{justify-self:center;display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.01em}
.branch small{display:block;font-weight:600;font-size:12px;color:#C7C2F0;letter-spacing:.02em}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:2px solid rgba(255,255,255,.4);display:grid;place-items:center;font-weight:800;font-size:14px}
.profile{position:relative}
.dropdown{position:absolute;right:0;top:50px;width:260px;background:#fff;color:#111827;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.25);padding:14px;display:flex;flex-direction:column;gap:12px}
.dropdown[hidden]{display:none}
.dropdown .who b{display:block} .dropdown .who span{font-size:13px;color:var(--muted)}
.langs{display:flex;gap:6px}
.langs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 4px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.langs button[aria-pressed="true"]{border-color:var(--accent);background:#EEEBFF}
.flag{display:inline-block;width:18px;height:12px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.12)} .flag svg{display:block;width:100%;height:100%}
.btn-logout{display:flex;align-items:center;justify-content:center;gap:8px;background:#FEE2E2;color:#991B1B;border:0;border-radius:10px;padding:10px;font-weight:700}
/* ---------- side menu ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,11,43,.45);z-index:40}
.scrim[hidden]{display:none}
.drawer{position:fixed;top:0;left:0;bottom:0;width:290px;max-width:85vw;background:#fff;z-index:50;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:8px 0 30px rgba(0,0,0,.2);display:flex;flex-direction:column;transform:translateX(-105%);transition:transform .2s}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--ink);color:#fff;font-weight:800;font-size:18px}
.drawer nav{padding:10px;overflow:auto;flex:1}
.nav-item{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:12px;padding:11px 12px;color:#111827;font-weight:600;text-align:left}
.nav-item:hover,.nav-item.active{background:#EEEBFF;color:var(--accent)}
.nav-item .chev{margin-left:auto;transition:transform .15s} .nav-item[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sub{padding:2px 0 6px 46px;display:flex;flex-direction:column;gap:2px}
.sub[hidden]{display:none}
.sub button{background:none;border:0;border-radius:10px;padding:8px 10px;text-align:left;display:flex;align-items:center;gap:8px;font-weight:600;color:#374151}
.sub button:hover{background:#F3F4F6}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.nav-label{font-size:11px;font-weight:800;letter-spacing:.1em;color:#9CA3AF;padding:14px 12px 4px}
.nav-sep{border:0;border-top:1px solid var(--line);margin:10px 4px}
.nav-item.logout{color:#991B1B} .nav-item.logout:hover{background:#FEE2E2}
/* ---------- main ---------- */
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding-block:22px 30px}
h1.page{font-size:24px;margin:0 0 16px;display:flex;align-items:center;gap:10px}
.ch-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.ch-card{border:0;text-align:left;border-radius:18px;padding:18px;background:#fff;border-top:8px solid var(--c);box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:14px;transition:transform .15s,box-shadow .15s}
.ch-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.12)} .ch-card:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.ch-card.htgo{--c:var(--htgo);background:linear-gradient(180deg,var(--htgo-light),#fff 70%)}
.ch-card.gk{--c:var(--gk);background:linear-gradient(180deg,var(--gk-light),#fff 70%)}
.ch-title{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800;color:var(--c)}
.ch-title svg{width:46px;height:46px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid rgba(0,0,0,.06);padding-top:10px;font-weight:600}
.kv b{font-size:26px;color:var(--c)}
.ch-card .kv-active,.ch-card .kv-returns{border-top:0;border-radius:10px;padding:7px 10px 7px 12px;color:#fff;font-size:13px;align-items:center}
.kv .lbl{display:inline-flex;align-items:center;gap:7px;line-height:1.2} .kv .lbl svg{width:17px;height:17px}
.kvs{display:grid;grid-auto-rows:1fr;gap:8px} /* both rows always the same height */
.kv-active{background:#15803D} .kv-returns{background:#B91C1C} .ch-card .kv-returns.zero{background:#E5E7EB;color:#4B5563}
.ch-card .kv-active b,.ch-card .kv-returns b{color:inherit;font-size:20px}
.daily{margin-top:26px}
.daily h2{font-size:15px;letter-spacing:.14em;margin:0 0 10px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.daily h2 .date-chip{margin-left:0}
/* home card is a div now (it holds the rating button) */
.ch-card[data-go]{cursor:pointer}
.ch-name{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.rating-link{border:0;background:#FEF3C7;color:#78350F;border-radius:999px;padding:3px 10px;font:inherit;font-size:13px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.rating-link b{font-weight:800} .rating-link span{font-weight:600;color:#92400E} .rating-link:hover{background:#FDE68A}
/* stars in boxes: --p = how much of the box is filled */
.stars{display:inline-flex;gap:3px}
.stars i{font-style:normal;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:13px;line-height:1;color:#fff;background:linear-gradient(90deg,#F59E0B var(--p),#D1D5DB var(--p))}
.stars.big i{width:30px;height:30px;font-size:19px;border-radius:7px}
.rv-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;margin-bottom:16px}
.rv-score{align-items:center;text-align:center;justify-content:center} .rv-big{font-size:48px;line-height:1;color:var(--c)}
.rv-dist{display:grid;grid-template-columns:36px 1fr 54px;gap:8px;align-items:center;font-size:13px;font-weight:600}
.rv-dist span:last-child{text-align:right}
.rv-bar{height:8px;background:#F3F4F6;border-radius:99px;overflow:hidden} .rv-bar i{display:block;height:100%;background:#F59E0B}
.rv-crit{display:grid;grid-template-columns:76px auto 1fr;gap:10px;align-items:center;font-size:14px;font-weight:600} .rv-crit b{text-align:right}
.rv-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.rv-head{display:flex;align-items:center;gap:10px} .rv-head div{flex:1;min-width:0} .rv-head div b{display:block}
.rv-av{width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0} .rv-ov{color:#B45309}
.rv-text{margin:0;font-size:14px;color:#374151;font-style:italic}
.daily-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.daily-col{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.05);border-left:6px solid var(--c)}
.daily-col.htgo{--c:var(--htgo)} .daily-col.gk{--c:var(--gk)}
.daily-col h3{margin:0 0 6px;color:var(--c);font-size:16px}
.drow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);color:var(--c);font-weight:600}
.drow:last-child{border-bottom:0} .drow b{font-size:18px}
/* channel pages */
.ch-head{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px 16px;color:#fff;margin-bottom:16px}
.ch-head.htgo{background:var(--htgo-dark)} .ch-head.gk{background:var(--gk-dark)}
.ch-head svg{width:40px;height:40px} .ch-head h1{margin:0;font-size:22px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;color:#374151;display:flex;gap:8px;align-items:center}
.tab .n{background:#F3F4F6;border-radius:999px;padding:1px 9px;font-size:13px}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff} .tab[aria-selected="true"] .n{background:rgba(255,255,255,.25)}
.theme-htgo{--c:var(--htgo)} .theme-gk{--c:var(--gk)}
.list{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.05);overflow:hidden}
.row{display:grid;grid-template-columns:1.2fr .8fr .6fr 1fr 1fr;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);width:100%;background:#fff;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0} button.row:hover{background:#FAFAFB}
.row.head{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#6B7280;background:#F9FAFB}
.row .no{font-weight:800}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.s-PENDING{background:#FEF3C7;color:#78350F} .s-PICKING{background:#DBEAFE;color:#1E3A8A} .s-READY{background:#DCFCE7;color:#14532D}
.s-ON_THE_WAY{background:#EDE9FE;color:#4C1D95} .s-DELIVERED{background:#F3F4F6;color:#374151} .s-CANCELLED{background:#FEE2E2;color:#7F1D1D}
.s-REQUESTED{background:#FEF3C7;color:#78350F} .s-APPROVED{background:#DCFCE7;color:#14532D} .s-REJECTED{background:#FEE2E2;color:#7F1D1D}
.late{color:#B91C1C;font-weight:800}
/* waiting levels of pending orders */
.waitcell{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.timecell{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.lvl{border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;white-space:nowrap}
.lvl.new{background:#DBEAFE;color:#1E3A8A} .lvl.wait{background:#FEF3C7;color:#78350F}
.lvl.late{background:#FFEDD5;color:#9A3412} .lvl.verylate{background:#B91C1C;color:#fff}
/* new-order banner (slides down from the top for 3 seconds) */
.banner{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));z-index:95;width:min(440px,calc(100% - 24px));transform:translate(-50%,-140%);transition:transform .35s ease;
  display:flex;align-items:center;gap:12px;background:#fff;color:#111827;border-radius:16px;padding:12px 14px;box-shadow:0 14px 36px rgba(14,11,43,.35);border-left:6px solid var(--accent)}
.banner.show{transform:translate(-50%,0)}
.banner.wa{border-left-color:#15803D}
.banner .bi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#EEEBFF;color:var(--accent);flex-shrink:0}
.banner.wa .bi{background:#DCFCE7;color:#15803D}
.banner .bi svg{width:24px;height:24px}
.banner b{display:block;font-size:15px} .banner span{font-size:12px;color:var(--muted);font-weight:600}
.banner.show .bi svg{animation:ring .5s ease-in-out 2}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(14deg)}75%{transform:rotate(-14deg)}}
@media (prefers-reduced-motion:reduce){.banner{transition:none} .banner.show .bi svg{animation:none}}
/* notifications page */
.al-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:start}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-size:16px}
button.reason{border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:800} button.reason:hover{text-decoration:underline}
.reason-sum .lbl{padding:5px 0;font-size:12px;font-weight:700;color:#374151}
.reason-sum button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;color:#374151}
.reason-sum button:hover{border-color:#9A3412} .reason-sum button[aria-pressed="true"]{background:#9A3412;border-color:#9A3412;color:#fff}
.reason-sum button[aria-pressed="true"] b{color:#fff} .reason-sum button.all{border-style:dashed}
.orderlink{border:0;background:none;padding:0;font:inherit;font-weight:800;color:var(--c,var(--accent));text-decoration:underline;text-underline-offset:3px}
.it.returned{background:#FFF1E6;border-radius:10px;padding-left:8px;padding-right:8px;outline:2px solid #FDBA74}
.it .rtag{display:block;margin-top:3px;font-size:11px;font-weight:800;color:#9A3412}
.rule{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;font-size:14px}
.rule .lvl{justify-self:start}
.rule em{font-style:normal;font-weight:800;font-size:13px;color:#374151}
.person{display:flex;align-items:center;gap:10px}
.person .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex-shrink:0}
.person div{flex:1;min-width:0} .person b{display:block;font-size:14px} .person span{font-size:12px;color:var(--muted)}
.demo-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.clock{font-weight:800;font-size:13px;background:#F3F4F6;border-radius:10px;padding:8px 10px}
.chat{background:#EFEAE2;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;max-height:560px;overflow:auto}
.bubble{background:#fff;border-radius:4px 14px 14px 14px;padding:9px 12px 6px;box-shadow:0 1px 1px rgba(0,0,0,.08);font-size:14px;line-height:1.4;max-width:100%}
.bubble.lv-late{background:#FFF7ED} .bubble.lv-verylate{background:#FEF2F2}
.bubble .from{display:block;font-size:12px;font-weight:800;color:#15803D;margin-bottom:2px}
.bubble .ords{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.bubble .ords span{background:#F3F4F6;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;color:#374151}
.bubble .meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#6B7280;margin-top:5px}
.bubble .meta i{font-style:normal;color:#2563EB}
@media (max-width:760px){.al-grid{grid-template-columns:1fr}}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* order detail */
.modal-wrap{position:fixed;inset:0;background:rgba(14,11,43,.5);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow:auto}
.modal-wrap[hidden]{display:none}
.modal{background:#fff;border-radius:18px;width:100%;max-width:720px;box-shadow:0 20px 50px rgba(0,0,0,.3);overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;color:#fff}
.modal-head.htgo{background:var(--htgo-dark)} .modal-head.gk{background:var(--gk-dark)}
.modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.items .it{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.it .nm b{display:block} .it .nm span{font-size:12px;color:var(--muted)}
.it.done .nm b{color:#15803D}
.counter{display:flex;align-items:center;gap:6px}
.counter button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:16px}
.counter .val{min-width:52px;text-align:center;font-weight:800}
.weight-in{width:80px;padding:6px 8px;border:1px solid var(--line);border-radius:9px;font:inherit}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--c,var(--accent));color:#fff}
.btn.ghost{background:#fff;color:#111827;border:1px solid var(--line)}
.btn.danger{background:#B91C1C} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger:disabled{background:#9CA3AF;opacity:1}
#cxReason{border:2px solid #D1D5DB} #cxReason.chosen{border-color:#B91C1C;color:#991B1B;font-weight:700}
.cx-hint{flex-basis:100%;font-weight:700;color:#6B7280}
.note{font-size:13px;color:var(--muted)}
.sum{display:flex;justify-content:space-between;font-weight:800;font-size:17px}
.calllog{font-size:13px;background:#F9FAFB;border-radius:10px;padding:8px 12px}
/* products */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font:inherit}
.prow{display:grid;grid-template-columns:52px 2.2fr .7fr .8fr .6fr .9fr auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.prow img.ph{width:48px;height:48px;border-radius:10px;object-fit:cover;background:#F3F4F6;display:block}
.prow .nm > span{display:block} .prow .code{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)} .prow .code svg{width:14px;height:14px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.page-head h1{margin:0}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn.icon{display:inline-flex;align-items:center;gap:8px} .btn.icon svg{width:18px;height:18px}
.counts{display:flex;gap:18px;flex-wrap:wrap;font-weight:600;color:#374151;margin-bottom:12px}
.counts b{color:var(--accent);font-size:17px}
.search{position:relative;flex:1;min-width:220px} .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#6B7280;width:20px;height:20px}
.search input{width:100%;padding:11px 12px 11px 42px;border:1px solid var(--line);border-radius:12px;font:inherit}
.editbtn{border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:#374151}
.editbtn:hover{border-color:var(--accent);color:var(--accent)} .editbtn svg{width:18px;height:18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:#374151}
.form label.full{grid-column:1 / -1}
.form input,.form select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;font-weight:500}
.form input.bad{border-color:#DC2626;background:#FEF2F2}
.field-icon{position:relative} .field-icon svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#6B7280}
.field-icon input{padding-left:36px;width:100%}
.hint{font-size:12px;font-weight:600} .hint.ok{color:#15803D} .hint.err{color:#B91C1C}
.imgbox{display:flex;align-items:center;gap:14px}

<!-- ============ Login page – everyone starts here ============ -->
<div id="login" class="login">
  <div class="login-wrap">
    <div class="login-top"><div class="langs" role="group" aria-label="Language"></div></div>

    <div class="market-box">
      <span class="mk" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10a4 4 0 0 1 8 0"/><path d="M3 10h18l-2 9a2 2 0 0 1-2 1.6H7A2 2 0 0 1 5 19z"/><path d="M8 14v3M12 14v3M16 14v3"/></svg></span>
      <div><b>Lindenkorb</b><span data-t="marketSub"></span></div>
    </div>

    <form id="loginForm" class="login-card" novalidate autocomplete="off">
      <div class="login-head">
        <h2 data-t="loginTitle"></h2>
        <button type="button" class="update-box" data-action="update">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
          <span data-t="updateApp"></span>
        </button>
      </div>

      <label for="loginEmail" data-t="email"></label>
      <div class="email-wrap">
        <input id="loginEmail" type="email" inputmode="email" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="demoList" aria-autocomplete="list">
        <div id="demoList" class="demo-list" role="listbox" hidden></div>
      </div>

      <label for="loginPass" data-t="password"></label>
      <input id="loginPass" type="password" autocomplete="off">

      <label class="remember"><input type="checkbox" id="rememberMe"><span data-t="rememberMe"></span></label>
      <p id="loginError" class="errbox" hidden></p>
      <button id="loginBtn" class="btn login-btn" type="button" data-t="login"></button>

      <div class="platforms">
        <p data-t="availableOn"></p>
        <div class="plat-row">
          <button type="button" class="plat" data-action="store"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>Apple</button>
          <button type="button" class="plat" data-action="store"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6.5" y="2.5" width="11" height="19" rx="2"/><path d="M6.5 6h11M6.5 18h11"/></svg>Android</button>
          <button type="button" class="plat" data-action="store"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16v4"/></svg>Windows</button>
        </div>
      </div>
    </form>
    <p class="login-foot">v1.0.0 · VetisPilot</p>
  </div>
</div>

<!-- ============ Courier page – opens when a return QR code is scanned (no login) ============ -->
<div id="courier" class="login" hidden></div>

<!-- ============ Top bar ============ -->
<header class="topbar gutter">
  <button id="menuBtn" class="iconbtn" aria-label="Menu" aria-expanded="false" aria-controls="drawer">

    <div><small data-t="branch"></small>Berlin-Spandau</div>

  // Reads a CSV file. Every row is checked; a row with any error is skipped and reported with its line number.
  function importCsv(text) {
    var lines = text.replace(/^﻿/, "").split(/\r?\n/), ok = 0, errors = [], seen = {};
    // The separator comes from the header row: ";" (Excel in DE/TR) or ",". Never both – "1,49" must stay one field.
    var header = lines[0] || "", sep = header.indexOf(";") >= 0 ? ";" : ",";
    lines.slice(1).forEach(function (line, idx) {
      var rowNo = idx + 2;
      if (!line.trim()) return;
      var f = line.split(sep).map(function (x) { return x.trim().replace(/^"(.*)"$/, "$1"); });
      var err = function (key) { errors.push(t("rowErr").replace("{n}", rowNo).replace("{reason}", t(key)) + (f[0] ? " (" + esc(f[0]) + ")" : "")); };
      if (f.length < 9) return err("errColumns");
      var code = f[0];
      if (/^\d+([.,]\d+)?E\+?\d+$/i.test(code)) return err("errBarcodeExcel");
      if (!/^\d{13}$/.test(code)) return err("errBarcodeLength");
      if (!eanValid(code)) return err("errBarcodeCheck");
      if (seen[code]) return err("errBarcodeTwice");
      if (barcodeState(code, null) === "dup") return err("errBarcodeDup");
      if (!f[1] || !f[2] || !f[3]) return err("errName");
      var bk = Object.keys(BRANDS).filter(function (k) { return k === f[4].toLowerCase() || BRANDS[k].name.toLowerCase() === f[4].toLowerCase(); })[0];
      if (!bk) return err("errBrand");
      var cat = (f[5] || "").toUpperCase();
      if (!CATS[cat]) return err("errCategory");
      if (!f[6]) return err("errSize");
      var price = parseNum(f[7]);
      if (!(price > 0)) return err("errPrice");
      if (!/^\d+$/.test(f[8])) return err("errStock");
      seen[code] = true;
      var sku = cat + "-N" + String(newCounter++).padStart(2, "0");
      P[sku] = {bk:bk, ean:code, brand:BRANDS[bk].name, tr:f[1], de:f[2], en:f[3], cat:cat, size:{tr:f[6], de:f[6], en:f[6].replace(",", ".")},
        price:Math.round(price * 100) / 100, stock:parseInt(f[8], 10)};
      ok++;
    });
    return {ok:ok, bad:errors.length, errors:errors};
  }

  // ======================= Return handover: the courier brings the returned products back =======================
  // Flow: return APPROVED -> courier on the way (WAITING) -> seller checks every product and creates a QR code (QR)
  //       -> the courier scans it (courier app; for now any phone camera) -> return accepted (RECEIVED).
  var APP_URL = "https://claude.ai/artifact/PDU89CzC8WzeQ6Tw427WQQ";   // public link of this prototype

  var db = null, dbLive = false;
  function handoverStatus(id) { return handover[id] ? handover[id].status : "WAITING"; }
  function rcode(id) { return id.replace("-", ""); }                    // R-298 -> R298 (safe in the link)
  function nowHM() { var d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  function newToken() {
    var abc = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", s = "", r = new Uint8Array(6);
    try { crypto.getRandomValues(r); } catch (x) { for (var i = 0; i < 6; i++) r[i] = Math.floor(Math.random() * 256); }
    for (var k = 0; k < 6; k++) s += abc[r[k] % abc.length];
    return s;
  }
  function qrUrl(id) { return APP_URL + "#rq-" + rcode(id) + "-" + handover[id].token; }
  function saveHandover(id) {
    handover[id].local = true;
    if (!db) return Promise.resolve(false);
    var body = {status:handover[id].status, token:handover[id].token, qrAt:handover[id].qrAt || "", receivedAt:handover[id].receivedAt || ""};
    return db.doc("handover/" + rcode(id)).set(body).then(function () { return true; }, function () { return false; });
  }
  // Shared state: only in the published link, and only for viewers who may write (the owner). Everyone else works locally.
  try {
    if (window.claude && window.claude.use) window.claude.use("db").then(function (d) {
      if (!d) return;
      db = d;
      db.collection("handover").onSnapshot(function (snap) {
        dbLive = true;
        var next = {};
        Object.keys(handover).forEach(function (id) { if (handover[id].local) next[id] = handover[id]; });
        snap.docs.forEach(function (doc) {
          var v = doc.data(); if (!v) return;
          var id = "R-" + doc.id.slice(1), before = handover[id] && handover[id].status;

    }, function () {});
  } catch (x) {}

  // ======================= Sales report: day / week / month / year =======================
  // Today comes from the live panel (same numbers as the home page). Earlier days are sample data,
  // calculated the same way every time (seeded), at a normal level for one supermarket branch.
  var reportPeriod = {htgo:"day", gk:"day"};
  var REPORT = {htgo:{perDay:96, basket:27.4}, gk:{perDay:82, basket:26.1}};
  var WD_MULT = [0, .92, .95, 1, 1.02, 1.14, 1.22];                     // Sunday = closed (shops in Germany)
  var SEASON = [.95, .93, .97, .98, 1, .94, .9, .9, .98, 1.02, 1.05, 1.15];
  var HOUR_W = {8:.03, 9:.05, 10:.07, 11:.09, 12:.12, 13:.11, 14:.08, 15:.07, 16:.08, 17:.1, 18:.1, 19:.06, 20:.03, 21:.01};
  var TOP_SHARE = {htgo:[["DRY-001",.09],["BEV-006",.07],["BAK-003",.06],["PRD-001",.055],["SNK-001",.05]],
                   gk:[["BEV-001",.08],["DRY-002",.07],["BRK-001",.055],["PRD-008",.05],["SWT-001",.045]]};
  function seeded(n) { var x = Math.sin(n) * 10000; return x - Math.floor(x); }
  function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function fmtDate(d, o) { return d.toLocaleDateString(t("locale"), o); }
  function dayStats(ch, date) {
    var today = new Date();
    if (sameDay(date, today)) { var d = daily(ch); return {orders:d.count, revenue:d.amount, cancelled:d.cancelled, returns:d.returns}; }
    if (date.getDay() === 0) return {orders:0, revenue:0, cancelled:0, returns:0, closed:true};
    var seed = date.getFullYear() * 400 + date.getMonth() * 32 + date.getDate() + (ch === "gk" ? 7777 : 0);
    var n = Math.round(REPORT[ch].perDay * WD_MULT[date.getDay()] * SEASON[date.getMonth()] * (.9 + .2 * seeded(seed)));
    var cx = Math.round(n * (.02 + .02 * seeded(seed + 2)));
    var basket = REPORT[ch].basket * (.94 + .12 * seeded(seed + 1));
    return {orders:n, revenue:Math.round((n - cx) * basket * 100) / 100, cancelled:cx, returns:Math.round(n * (.008 + .01 * seeded(seed + 3)))};
  }
  function sumStats(list) {
    return list.reduce(function (a, s) { return {orders:a.orders + s.orders, revenue:a.revenue + s.revenue, cancelled:a.cancelled + s.cancelled, returns:a.returns + s.returns}; },
      {orders:0, revenue:0, cancelled:0, returns:0});
  }
  // buckets = the bars of the chart and the rows of the table
  function reportBuckets(ch, period) {
    var today = new Date(), out = [];
    if (period === "day") {
      var d = dayStats(ch, today), lastHour = Math.min(21, Math.floor(NOW / 60)), hours = [], wsum = 0, given = 0;
      for (var h = 8; h <= 21; h++) { hours.push(h); if (h <= lastHour) wsum += HOUR_W[h]; }
      hours.forEach(function (h, i) {
        var share = h <= lastHour ? HOUR_W[h] / wsum : 0, n = h === lastHour ? d.orders - given : Math.round(d.orders * share);
        if (h > lastHour) n = 0; given += n;
        out.push({label:String(h).padStart(2, "0") + ":00", short:String(h).padStart(2, "0"), orders:n, revenue:d.orders ? d.revenue * n / d.orders : 0,
                  cancelled:0, returns:0, future:h > lastHour});
      });
      out.total = d;
    } else if (period === "week") {
      for (var b = 6; b >= 0; b--) { var x = new Date(); x.setDate(x.getDate() - b); var s = dayStats(ch, x);
        s.label = fmtDate(x, {weekday:"long", day:"numeric", month:"short"}); s.short = fmtDate(x, {weekday:"short"}); out.push(s); }
      out.total = sumStats(out);
    } else if (period === "month") {
      for (var dd = 1; dd <= today.getDate(); dd++) { var y = new Date(today.getFullYear(), today.getMonth(), dd), s2 = dayStats(ch, y);
        s2.label = fmtDate(y, {weekday:"short", day:"numeric", month:"short"}); s2.short = String(dd); out.push(s2); }
      out.total = sumStats(out);
    } else {
      for (var m = 0; m <= today.getMonth(); m++) {
        var last = m === today.getMonth() ? today.getDate() : new Date(today.getFullYear(), m + 1, 0).getDate(), days = [];
        for (var k = 1; k <= last; k++) days.push(dayStats(ch, new Date(today.getFullYear(), m, k)));
        var s3 = sumStats(days), mo = new Date(today.getFullYear(), m, 1);
        s3.label = fmtDate(mo, {month:"long"}) + (m === today.getMonth() ? " (" + t("soFar") + ")" : ""); s3.short = fmtDate(mo, {month:"short"}); out.push(s3);
      }
      out.total = sumStats(out);
    }
    return out;
  }
  function periodChip(period) {

    if (period === "week") return t("chipWeek") + " · " + fmtDate(from, {day:"numeric", month:"short"}) + " – " + fmtDate(today, {day:"numeric", month:"short", year:"numeric"});
    if (period === "month") return t("chipMonth") + " · " + fmtDate(today, {month:"long", year:"numeric"}) + " (1–" + today.getDate() + ")";
    return t("chipYear") + " · " + today.getFullYear() + " (" + fmtDate(new Date(today.getFullYear(), 0, 1), {month:"short"}) + " – " + fmtDate(today, {month:"short"}) + ")";
  }

    if (el === profileBtn) { setDropdown(dropdown.hidden); return; }
    if (!el.closest(".profile")) setDropdown(false);
    var d = el.dataset;
    if (d.go) { location.hash = d.go; setMenu(false); window.scrollTo(0, 0); return; }
    if (d.toggle) { var sub = document.getElementById(d.toggle), open = sub.hidden; sub.hidden = !open; el.setAttribute("aria-expanded", String(open)); return; }
    if (d.action === "closeMenu") { setMenu(false); return; }
    if (d.action === "logout") { logout(); return; }
    if (d.lang) { lang = d.lang; try { localStorage.setItem("vp-proto-lang", lang); } catch (x) {} render(); return; }
    if (d.tab) { currentTab[d.ch] = d.tab; render(); return; }
    if (d.accept) {
      var acc = orders.filter(function (o) { return o.no === d.accept; })[0];
      acc.status = "PICKING"; acc.picker = currentUser ? currentUser.id : null; render(); toast(t("acceptedToast")); return;
    }
    if (d.order) { openOrder = orders.filter(function (o) { return o.no === d.order; })[0]; renderModal(); return; }
    // product list: new, edit, import
    if ("newProduct" in d) { openProductForm(null); return; }
    if (d.edit) { openProductForm(d.edit); return; }
    if ("import" in d) { importing = {file:"", result:"", bad:0}; renderImportModal(); return; }
    if ("closeForm" in d) { closeModal(); return; }
    if ("saveProduct" in d) { saveProduct(); return; }
    if ("copySample" in d) {
      var text = sampleCsv();
      var done = function () { toast(t("copied")); };
      var fallback = function () {
        var node = document.getElementById("samplecsv"), range = document.createRange();
        range.selectNodeContents(node); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range); toast(t("selectToCopy"));
      };
      try { navigator.clipboard.writeText(text).then(done, fallback); } catch (x) { fallback(); }
      return;
    }
    if (d.sale) {
      var sp = d.sale.split("|"), prod = P[sp[0]], sch = sp[1];
      if (prod.stock <= 0) return;
      prod.closed = prod.closed || {};
      prod.closed[sch] = isOpen(prod, sch);
      render();
      toast(t(isOpen(prod, sch) ? "saleOpened" : "saleClosed").replace("{p}", prod[lang]).replace("{ch}", CH[sch].name));
      return;
    }
    if (d.saleFilter) { saleFilter = d.saleFilter; render(); return; }
    if (d.period) { reportPeriod[d.ch] = d.period; render(); return; }
    if (d.reasonFilter != null) { var rch = location.hash.indexOf("gk") >= 0 ? "gk" : "htgo"; returnFilter[rch] = returnFilter[rch] === d.reasonFilter ? "" : d.reasonFilter; render(); return; }
    if (d.openOrder) { openOrder = orders.filter(function (o) { return o.no === d.openOrder; })[0]; if (openOrder) { openOrder.hlRet = find(d.ret) || null; renderModal(); } return; }
    if (d.wa) { STAFF_WA[d.wa] = !STAFF_WA[d.wa]; render(); return; }
    if (d.demo === "order") { arriveOrder(); return; }
    if (d.demo === "advance") { advanceClock(); return; }
    if (d.demo === "sound") { chime(); return; }
    if (d.approve) { var ap = find(d.approve); ap.status = "APPROVED"; ap.courier = ap.courier || COURIERS[ap.ch]; render(); toast(t("returnSaved")); return; }
    if (d.hoQr) { handover[d.hoQr] = {status:"QR", token:newToken(), qrAt:nowHM(), receivedAt:""}; saveHandover(d.hoQr); render(); return; }
    if (d.hoScan) { var sid = d.hoScan; markReceived(sid); render(); showBanner("ok", t("ho_RECEIVED") + " · " + sid, t("hoToast").replace("{id}", sid)); return; }
    if ("hoReset" in d) { Object.keys(handover).forEach(function (id) { if (db) db.doc("handover/" + rcode(id)).delete().catch(function () {}); }); handover = {}; hoChecked = {}; render(); return; }
    if ("courierOk" in d && courierMode) { var cm = courierMode; markReceived(cm.id, cm.token).then(function (ok) { courierSynced = ok; renderCourier(); }); renderCourier(); return; }
    if (d.reject) { rejecting = d.reject; render(); var inp = document.getElementById("rreason"); if (inp) inp.focus(); return; }
    if (d.rejectSave) {
      var reason = (document.getElementById("rreason").value || "").trim();
      if (!reason) { toast(t("reasonRequired")); return; }
      var r = find(d.rejectSave); r.status = "REJECTED"; r.rejection = reason; rejecting = null; render(); toast(t("returnSaved")); return;
    }
    // order detail actions
    if (!openOrder) return;
    var o = openOrder;
    if ("close" in d) { closeModal(); return; }
    if ("start" in d) { o.status = "PICKING"; o.picker = currentUser ? currentUser.id : null; currentTab[o.ch] = "PICKING"; toast(t("acceptedToast")); render(); return; }
    if (d.plus != null) { var a = o.items[+d.plus]; if (a.picked < a.qty) a.picked++; renderModal(); return; }
    if (d.minus != null) { var b = o.items[+d.minus]; if (b.picked > 0) b.picked--; renderModal(); return; }
    if ("call" in d) { if (o.calls < 2) o.calls++; renderModal(); return; }
    if ("cancel" in d) {
      var sel = document.getElementById("cxReason"), why = sel ? sel.value : "";
      if (!branchCancelAllowed(o, why)) return;
      o.reason = why; o.status = "CANCELLED"; currentTab[o.ch] = "CANCELLED";
      render(); toast(t("cancelledToast").replace("{r}", t("CR_" + o.reason))); return;
    }
    if ("ready" in d) {
      // weights within ±10 %, products at most +15 %, missing products / big drop only with the customer's approval
      if (readyProblems(o).length) { o.readyError = true; renderModal(); return; }
      if (o.custOk) o.custOkLogged = nowHM();   // stored with the order (audit), like a call record
      o.bags = Math.max(0, Math.min(20, parseInt(document.getElementById("bags").value, 10) || 0));
      o.readyError = false; o.status = "READY"; currentTab[o.ch] = "READY"; toast(t("readyToast")); render(); return;
    }
    function find(id) { return returns.filter(function (x) { return x.id === id; })[0]; }
  });
  function find(id) { return returns.filter(function (x) { return x.id === id; })[0]; }

  document.addEventListener("input", function (e) {
    if (e.target.id === "psearch") {
      productFilter = e.target.value; var pos = e.target.selectionStart; render();
      var s = document.getElementById("psearch"); s.focus(); s.setSelectionRange(pos, pos);
    }
    if (e.target.id === "cxReason" && openOrder) { openOrder.cxDraft = e.target.value; renderModal(); }
    if (e.target.id === "soundOn") soundOn = e.target.checked;
    if (e.target.dataset && e.target.dataset.hoCheck) { var hp = e.target.dataset.hoCheck.split("|"); hoChecked[hp[0]] = hoChecked[hp[0]] || {}; hoChecked[hp[0]][hp[1]] = e.target.checked; render(); }
    if (e.target.id === "salesearch") {
      saleQuery = e.target.value; var pos2 = e.target.selectionStart; render();
      var s2 = document.getElementById("salesearch"); s2.focus(); s2.setSelectionRange(pos2, pos2);
    }
    if (e.target.dataset.kg != null && openOrder) {
      var it = openOrder.items[+e.target.dataset.kg], v = parseNum(e.target.value);
      it.kg = v > 0 ? v : null;
      // live while typing: red field when outside ±10 %, and the amount check box updates (full redraw on "change")
      e.target.classList.toggle("bad", weightState(it) === "bad");
      var box = modal.querySelector(".limit");
      if (box) box.outerHTML = limitHtml(openOrder);
    }
    if (e.target.id === "bags" && openOrder) openOrder.bagsDraft = e.target.value;
    if (e.target.id === "custOk" && openOrder) { openOrder.custOk = e.target.checked; renderModal(); }
    if (e.target.dataset.f && editing) {
      var key = e.target.dataset.f, caret = e.target.selectionStart;
      editing.v[key] = key === "ean" ? e.target.value.replace(/\D/g, "") : e.target.value;
      editing.err = "";
      renderProductModal();
      var again = modal.querySelector('[data-f="' + key + '"]');
      if (again) { again.focus(); if (again.setSelectionRange && caret != null) try { again.setSelectionRange(caret, caret); } catch (x) {} }
    }
  });
  document.addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    if (e.target.id === "imgfile" && editing) {
      var okType = ["image/jpeg", "image/png", "image/webp"].indexOf(file.type) >= 0;
      if (!okType || file.size > 2 * 1024 * 1024) { editing.imgErr = true; renderProductModal(); return; }
      var reader = new FileReader();
      reader.onload = function () { editing.img = reader.result; editing.imgErr = false; renderProductModal(); };
      reader.readAsDataURL(file);
    }
    if (e.target.id === "csvfile" && importing) {
      var r2 = new FileReader();
      r2.onload = function () {
        var res = importCsv(String(r2.result));
        importing.file = file.name; importing.bad = res.bad;
        importing.result = t("importResult").replace("{ok}", res.ok).replace("{bad}", res.bad) +
          (res.errors.length ? '<ul style="margin:8px 0 0;padding-left:18px;font-weight:500">' + res.errors.slice(0, 10).map(function (x) { return "<li>" + x + "</li>"; }).join("") +
          (res.errors.length > 10 ? "<li>…</li>" : "") + "</ul>" : "");
        render();
      };
      r2.readAsText(file);
    }
  });
  // weight field: full redraw when the value is confirmed (leaving the field or Enter)
  document.addEventListener("change", function (e) { if (e.target.dataset && e.target.dataset.kg != null && openOrder) renderModal(); });
  scrim.addEventListener("click", function () { setMenu(false); });
  modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.matches && e.target.matches(".row[data-order], .ch-card[data-go]")) { e.target.click(); return; }
    if (e.key !== "Escape") return;
    if (!demoList.hidden) { showDemoList(false); return; }
    if (!modal.hidden) closeModal();
    else if (drawer.classList.contains("open")) setMenu(false);
    else setDropdown(false);
  });
  emailIn.addEventListener("focus", function () { showDemoList(true); });
  emailIn.addEventListener("click", function () { showDemoList(true); });
  emailIn.addEventListener("input", function () { loginErr.hidden = true; showDemoList(emailIn.value === ""); });
  passIn.addEventListener("input", function () { loginErr.hidden = true; });
  // Login works from the button's own tap (some Android browsers, e.g. on Tecno phones, never send the form's
  // "submit" event inside the viewer frame), from the Enter key in both fields, and from a normal form submit.
  document.getElementById("loginForm").addEventListener("submit", function (e) { e.preventDefault(); doLogin(); });
  document.getElementById("loginBtn").addEventListener("click", function (e) { e.preventDefault(); doLogin(); });
  [emailIn, passIn].forEach(function (f) { f.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); doLogin(); } }); });
  function doLogin() {
    unlockAudio();
    var mail = emailIn.value.trim().toLowerCase(), pass = passIn.value;
    if (!mail || !pass) { loginErr.textContent = t("loginEmpty"); loginErr.hidden = false; return; }
    var a = ACCOUNTS.filter(function (x) { return x.email === mail && x.pass === pass; })[0];
    if (!a) { loginErr.textContent = t("loginWrong"); loginErr.hidden = false; passIn.value = ""; passIn.focus(); return; }
    showDemoList(false);
    enterPanel(a, document.getElementById("rememberMe").checked);
    // demo: a new order arrives a few seconds after logging in (sound + banner)
    if (!arriveOrder.demoDone) { arriveOrder.demoDone = true; setTimeout(function () { if (currentUser) arriveOrder(); }, 8000); }
    toast(t("welcome").replace("{name}", a.name.split(" ")[0]));
  }
  window.addEventListener("hashchange", function () { if (currentUser && !courierMode) render(); });

  // Start: a scanned return QR code opens the courier page; otherwise only a remembered (or same-tab) login skips the login page
  courierMode = parseCourierHash();
  if (courierMode) { loginEl.hidden = true; document.getElementById("courier").hidden = false; renderCourier(); return; }
  render();
  var savedId = stored("local") || stored("session");
  var savedAcc = ACCOUNTS.filter(function (x) { return x.id === savedId; })[0];
  if (savedAcc) enterPanel(savedAcc, !!stored("local"));
  else loginEl.hidden = false;
})();
</script>
</body>
</html>
