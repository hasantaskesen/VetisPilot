# VetisPilot – local development stack
# Start:  docker compose up -d        Stop:  docker compose down
# Reset the database (deletes all data):  docker compose down -v
#
# Secrets come from the .env file (copy .env.example to .env). .env is never committed.

services:
  db:
    image: postgres:16-alpine
    container_name: vetispilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Berlin
    ports:
      - "127.0.0.1:5432:5432"          # only reachable from this computer
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro   # runs *.sql once, on the first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
