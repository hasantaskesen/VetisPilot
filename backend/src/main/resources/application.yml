# VetisPilot backend configuration.
# Secrets are never written here – they come from the .env file in the project root
# (or from real environment variables, e.g. in Docker).
spring:
  application:
    name: vetispilot
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:vetispilot}
    username: ${POSTGRES_USER:vetispilot}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Hibernate only checks the tables; Flyway creates them
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # db/demo adds the demo branch and accounts of the prototype; leave it out for a real installation
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

vetispilot:
  version: 0.1.0
  security:
    jwt-secret: ${JWT_SECRET}          # from .env – never written here
    token-hours: 8                     # US-01: logged out after 8 hours
    max-failed-logins: 5               # US-02: the 5th wrong password locks the account ...
    lock-minutes: 15                   # ... for 15 minutes
