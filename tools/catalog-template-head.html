<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VetisPilot demo catalog — 100 products</title>
<style>
/* Theme: VetisPilot colors until a channel is chosen, then the channel's own colors (US-39) */
body{--hdr:#0E0B2B;--accent:#5B3DF5;--page:#F4F5F7;--soft:#C7C2F0}
body[data-channel="htgo"]{--hdr:#0B2A6F;--accent:#1D4ED8;--page:#EEF3FF;--soft:#DBE6FF}
body[data-channel="gk"]{--hdr:#3E2410;--accent:#7C4A21;--page:#FAF4EC;--soft:#F3E6D3}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--page);color:#111827;transition:background .2s}
header{background:var(--hdr);color:#fff;padding:40px 24px;transition:background .2s} .wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.top-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0 0 8px;font-size:32px;letter-spacing:-.02em} header p{margin:0;color:var(--soft);max-width:720px;line-height:1.5}
.channel-pill{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border-radius:999px;padding:4px 4px 4px 6px;font-weight:700;font-size:14px}
.channel-pill[hidden]{display:none} .channel-pill img{display:block;border-radius:8px}
.channel-pill button{font:inherit;font-size:12px;font-weight:700;background:#fff;color:var(--hdr);border:0;border-radius:999px;padding:6px 12px;cursor:pointer}
.channel-pill button:focus-visible{outline:2px solid #34D399;outline-offset:2px}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px;flex-shrink:0}
.lang button{font:inherit;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--soft);background:none;border:0;border-radius:999px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.lang button:hover{color:#fff}
.flag{display:inline-block;width:20px;height:14px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.35);flex-shrink:0}
.flag svg{display:block;width:100%;height:100%}.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
.lang button:focus-visible{outline:2px solid #34D399;outline-offset:2px}
.stats{display:flex;gap:24px;flex-wrap:wrap;margin-top:20px} .stats div{background:rgba(255,255,255,.08);padding:10px 16px;border-radius:10px;font-size:14px}
.stats b{display:block;font-size:22px}
h2{font-size:20px;margin:40px 0 16px;display:flex;align-items:center;gap:10px} h2 .count{font-size:13px;background:#E5E7EB;color:#374151;padding:2px 10px;border-radius:999px}
.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.brand{font:inherit;margin:0;background:#fff;border:1px solid #E5E7EB;border-radius:14px;padding:12px;display:flex;justify-content:center;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.brand:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.08)} .brand:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.brand[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)} .brand img{max-width:100%;height:auto}
.filterbar{position:sticky;top:0;z-index:5;margin:20px 0 0;background:var(--hdr);color:#fff;border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.filterbar[hidden]{display:none} .filterbar button{font:inherit;font-weight:700;font-size:13px;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
.weight{margin:0;font-size:11px;color:#1F6F3A;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:#fff;border:1px solid #E5E7EB;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{height:96px;display:flex;align-items:center;justify-content:center}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.brandname{margin:0;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
h3{margin:0;font-size:15px;line-height:1.3} .meta{margin:0;font-size:12px;color:#4B5563}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;gap:8px}
.price{font-weight:700;font-size:16px} .tag{font-size:11px;padding:3px 8px;border-radius:999px;white-space:nowrap}
.ok{background:#DCFCE7;color:#14532D} .low{background:#FEF3C7;color:#78350F} .out{background:#FEE2E2;color:#7F1D1D}
footer{padding:40px 0;color:#4B5563;font-size:13px}
/* Channel chooser */
.chooser{position:fixed;inset:0;z-index:50;background:#0E0B2B;display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:auto}
.chooser[hidden]{display:none}
.chooser-inner{width:100%;max-width:880px}
.chooser-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.chooser h2{margin:0;color:#fff;font-size:30px;letter-spacing:-.02em}
.chooser-hint{color:#C7C2F0;margin:10px 0 28px;line-height:1.5}
.channel-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.channel-card{font:inherit;border:0;border-top:8px solid var(--c);border-radius:20px;padding:32px 20px 22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:20px;transition:transform .15s,box-shadow .15s}
.channel-card[data-channel="htgo"]{--c:#1D4ED8;background:linear-gradient(180deg,#DBE6FF 0%,#FFFFFF 75%)}
.channel-card[data-channel="gk"]{--c:#7C4A21;background:linear-gradient(180deg,#F3E6D3 0%,#FFFFFF 75%)}
.channel-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.channel-card:focus-visible{outline:3px solid #34D399;outline-offset:3px}
.channel-card img{width:100%;max-width:300px;height:auto}
.channel-card .enter{background:var(--c);color:#fff;border-radius:999px;padding:9px 26px;font-weight:700;font-size:15px}
@media (max-width:640px){.channel-cards{grid-template-columns:1fr} .chooser h2{font-size:24px}}
@media (max-width:600px){header{padding:28px 0} header h1{font-size:24px} .wrap{padding:0 16px}}
</style></head><body>
